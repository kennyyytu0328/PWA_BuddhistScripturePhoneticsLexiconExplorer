name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # third-party action: pinned to a commit
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # CBETA text is kept out of the public repo (THIRD_PARTY_NOTICES.md); the build compares against it.
      - name: Restore CBETA source text
        env:
          CBETA_T08N0251_B64: ${{ secrets.CBETA_T08N0251_B64 }}
        run: |
          if [ -z "$CBETA_T08N0251_B64" ]; then
            echo "::error::Repository secret CBETA_T08N0251_B64 is not set (see README, Deploy)"
            exit 1
          fi
          mkdir -p data-sources/cbeta
          printf '%s' "$CBETA_T08N0251_B64" | base64 -d > data-sources/cbeta/T08n0251.txt

      - run: pnpm test

      - name: Build
        run: pnpm build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
